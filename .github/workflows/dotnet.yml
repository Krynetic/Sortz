name: .NET 11 CI
on: [push, pull_request]
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build Krynetic.Sortz.sln -c Release
      - run: dotnet test Krynetic.Sortz.sln -c Release --no-build --logger "console;verbosity=detailed"
