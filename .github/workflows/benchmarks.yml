name: Sorting benchmarks
on: [push]
jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: fast-actions/setup-dotnet@v1
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          dotnet-version: '11.0.x'
          allow-preview: true
      - run: dotnet test Krynetic.Sortz.Tests/Krynetic.Sortz.Tests.csproj -c Release
      - run: dotnet run -c Release --project Krynetic.Sortz.Benchmarks -- --filter '*SortBenchmarks*' --exporters json
      - name: Publish results
        if: always()
        run: |
          for report in BenchmarkDotNet.Artifacts/results/*-report-github.md; do
            if [ -f "$report" ]; then
              {
                printf '## %s\n\n' "$(basename "$report" -report-github.md)"
                cat "$report"
                printf '\n\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      #- uses: actions/upload-artifact@v7
      #  if: always()
