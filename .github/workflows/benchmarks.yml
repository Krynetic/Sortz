name: Sorting benchmarks
on:
  workflow_dispatch:
  push:
jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: fast-actions/setup-dotnet@v1
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          dotnet-version: '11.0.x'
          allow-preview: true
      - run: dotnet test Krynetic.Sortz.Tests/Krynetic.Sortz.Tests.csproj -c Release -f net11.0
      - run: dotnet run -c Release -f net11.0 --project Krynetic.Sortz.Benchmarks -- --filter '*SortBenchmarks*' --exporters json
      - name: Publish results
        if: always()
        run: |
          for report in BenchmarkDotNet.Artifacts/results/*-report-github.md; do
            if [ -f "$report" ]; then
              {
                printf '## %s\n\n' "$(basename "$report" -report-github.md)"
                cat "$report"
                printf '\n\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      #- uses: actions/upload-artifact@v7
      #  if: always()
      #  with:
      #    name: benchmark-results
      #    path: BenchmarkDotNet.Artifacts/results/
  # Opt in for performance commits without running the competitor suite on every push.
  comparison:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[compare]') }}
    needs: benchmark
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Run unchanged competitor benchmarks
        run: dotnet run -c Release -f net11.0 --project Krynetic.Sortz.Comparison -- --filter '*ComparisonBenchmarks*' --exporters json
      - name: Publish comparison results
        if: always()
        run: |
          found=0
          failed=0
          for report in BenchmarkDotNet.Artifacts/results/*ComparisonBenchmarks-report-github.md; do
            if [ -f "$report" ]; then
              found=1
              if grep -q 'Benchmarks with issues:' "$report"; then
                failed=1
              fi
              cat "$report"
              {
                printf '## %s\n\n' "$(basename "$report" -report-github.md)"
                cat "$report"
                printf '\n\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          test "$found" -eq 1 && test "$failed" -eq 0
