name: Sorting benchmarks
on:
  workflow_dispatch:
  push:
jobs:
  benchmark:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: fast-actions/setup-dotnet@v1
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          dotnet-version: '11.0.x'
          allow-preview: true
      - run: dotnet test Krynetic.Sortz.Tests/Krynetic.Sortz.Tests.csproj -c Release -f net11.0
      - run: dotnet run -c Release -f net11.0 --project Krynetic.Sortz.Benchmarks -- --filter '*SortBenchmarks*' --exporters json
      - name: Publish results
        if: always()
        run: |
          for report in BenchmarkDotNet.Artifacts/results/*-report-github.md; do
            if [ -f "$report" ]; then
              {
                printf '## %s\n\n' "$(basename "$report" -report-github.md)"
                cat "$report"
                printf '\n\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Compare candidate with main on the same runner
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          baseline_sha=$(git rev-parse FETCH_HEAD)
          baseline=$(mktemp -d)
          trap 'git worktree remove --force "$baseline" || true' EXIT
          git worktree add --detach "$baseline" "$baseline_sha"
          # Both revisions must use one invocation per iteration and identical inputs.
          cp Krynetic.Sortz.Benchmarks/SortBenchmarkConfig.cs "$baseline/Krynetic.Sortz.Benchmarks/SortBenchmarkConfig.cs"
          dotnet run -c Release -f net11.0 --project Krynetic.Sortz.Comparison -- --filter '*ComparisonBenchmarks*' --exporters json
          (
            cd "$baseline"
            dotnet run -c Release -f net11.0 --project Krynetic.Sortz.Benchmarks -- --filter '*SortBenchmarks*' --exporters json
            dotnet run -c Release -f net11.0 --project Krynetic.Sortz.Comparison -- --filter '*ComparisonBenchmarks*' --exporters json
          )
          echo "Baseline: $baseline_sha; candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/check-sortz-regressions.py "$baseline/BenchmarkDotNet.Artifacts/results" BenchmarkDotNet.Artifacts/results >> "$GITHUB_STEP_SUMMARY"
      #- uses: actions/upload-artifact@v7
      #  if: always()
      #  with:
      #    name: benchmark-results
      #    path: BenchmarkDotNet.Artifacts/results/
